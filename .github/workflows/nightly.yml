name: Nightly Build

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"

permissions:
  contents: write

jobs:
  check-nightly:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      reason: ${{ steps.guard.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check latest nightly tag
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "reason=manual run requested" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_tag="$(git for-each-ref --count=1 --sort=-creatordate --format='%(refname:short)' 'refs/tags/nightly-*')"

          if [[ -z "${latest_tag}" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "reason=no previous nightly tag found" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_sha="$(git rev-list -n 1 "${latest_tag}")"

          if [[ "${latest_sha}" == "${GITHUB_SHA}" ]]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "reason=${GITHUB_SHA} already has ${latest_tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "reason=new commit detected since ${latest_tag}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report decision
        run: echo "${{ steps.guard.outputs.reason }}"

  build:
    name: Build ${{ matrix.name }}
    needs: check-nightly
    if: ${{ needs.check-nightly.outputs.should_run == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      # Require Linux's software Vulkan tests before publishing.
      FRAGILE_REQUIRE_GPU_TESTS: ${{ matrix.name == 'linux-x64' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: fragile-notepad-windows-x64
            archive: fragile-notepad-windows-x64.zip
          - name: linux-x64
            os: ubuntu-22.04
            artifact: fragile-notepad-linux-x64
            archive: fragile-notepad-linux-x64.tar.gz
          - name: macos-arm64
            os: macos-latest
            artifact: fragile-notepad-macos-arm64
            archive: fragile-notepad-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            artifact: fragile-notepad-macos-x64
            archive: fragile-notepad-macos-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python asset and font tooling
        run: python -m pip install -r scripts/requirements-assets.txt -r scripts/requirements-font-profiles.txt cmake==3.31.6

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Test font preparation
        run: python -m unittest discover -s scripts -p 'test_*font_profiles.py'

      - name: Test package validation tooling
        run: |
          python -m unittest discover -s scripts -p test_check_package.py
          python -m unittest discover -s scripts -p test_create_macos_app.py

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'scripts/*font_profiles*', 'scripts/font_families.py', 'scripts/requirements-font-profiles.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-

      - name: Install Linux windowing and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            pkg-config \
            fontconfig \
            dpkg-dev \
            rpm \
            desktop-file-utils \
            xvfb \
            xauth

      - name: Configure Linux software Vulkan adapter
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/setup-ci-vulkan.sh

      - name: Install macOS Vulkan runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install molten-vk vulkan-loader vulkan-tools
          source scripts/setup-macos-vulkan.sh
          vulkaninfo --summary

      - name: Configure Windows software Vulkan adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-ci-vulkan.ps1

      - name: Generate illustrations and platform icons
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\generate_icon_assets.ps1

      - name: Generate illustrations and platform icons
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/generate_icon_assets.sh

      - name: Prepare regional font profiles
        if: runner.os == 'Windows'
        run: python scripts/prepare_font_profiles.py --out-dir target/font-profiles/prepared --target-os windows --cache-dir target/font-profiles

      - name: Prepare regional font profiles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            font_target_os=macos
          else
            font_target_os=linux
          fi
          python scripts/prepare_font_profiles.py --out-dir target/font-profiles/prepared \
            --target-os "$font_target_os" --cache-dir target/font-profiles

      - name: Test Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked

      - name: Check Windows software-only build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo check --locked --no-default-features

      - name: Test macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/setup-macos-vulkan.sh
          cargo test --locked
          cargo check --locked --no-default-features

      - name: Test Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          WINIT_UNIX_BACKEND=x11 xvfb-run -a cargo test --locked
          cargo check --locked --no-default-features

      - name: Build release
        if: runner.os != 'Windows'
        run: cargo build --release --locked -j 1

      - name: Build Windows release with the C runtime included
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -j 1

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\package
          Copy-Item target\release\fragile-notepad.exe dist\package\
          Copy-Item LICENSE dist\package\
          Copy-Item assets\icons\NOTICE.txt dist\package\ICON-NOTICES.txt
          Copy-Item assets\icons\file-types\LICENSE dist\package\FILE-TYPE-ICON-NOTICES.txt
          if ((Test-Path target\release\FONT-NOTICES.txt) -and ((Get-Item target\release\FONT-NOTICES.txt).Length -gt 0)) {
            Copy-Item target\release\FONT-NOTICES.txt dist\package\
            if (Test-Path target\font-profiles\prepared\licenses) {
              Copy-Item target\font-profiles\prepared\licenses dist\package\font-licenses -Recurse
            }
          }
          Compress-Archive -Path dist\package\* -DestinationPath dist\${{ matrix.archive }} -Force

      - name: Package Unix artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/fragile-notepad dist/package/
          cp LICENSE dist/package/
          cp assets/icons/NOTICE.txt dist/package/ICON-NOTICES.txt
          cp assets/icons/file-types/LICENSE dist/package/FILE-TYPE-ICON-NOTICES.txt
          if [[ -s target/release/FONT-NOTICES.txt ]]; then
            cp target/release/FONT-NOTICES.txt dist/package/
            if [[ -d target/font-profiles/prepared/licenses ]]; then
              cp -R target/font-profiles/prepared/licenses dist/package/font-licenses
            fi
          fi
          tar -C dist/package -czf "dist/${{ matrix.archive }}" .

      - name: Package macOS Vulkan runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/package-macos.sh dist/package
          tar -C dist/package -czf "dist/${{ matrix.archive }}" .

      - name: Test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/check_package.py dist/${{ matrix.archive }}

      - name: Test Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: WINIT_UNIX_BACKEND=x11 xvfb-run -a python scripts/check_package.py dist/${{ matrix.archive }}

      - name: Test macOS release archive
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/check_package.py dist/${{ matrix.archive }}

      - name: Build native installers
        run: |
          cmake -S scripts/packaging -B target/installer
          cpack --config target/installer/CPackConfig.cmake -B dist

      - name: Test Linux desktop entry and package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          desktop-file-validate scripts/packaging/linux/fragile-notepad.desktop
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm --query --package --requires dist/*.rpm
          rpm --query --package --list dist/*.rpm

      - name: Test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/packaging/check-windows.ps1 -Installer (Get-ChildItem dist/*-setup.exe).FullName

      - name: Test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/check_package.py dist/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.archive }}
            dist/*-setup.exe
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error

  test-linux-installers:
    name: Install on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            install: apt-get update && apt-get install -y python3 /packages/*.deb
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            install: apt-get update && apt-get install -y python3 /packages/*.deb
          - name: Fedora 43
            image: fedora:43
            install: dnf install -y python3 /packages/*.rpm
          - name: openSUSE Leap 16.0
            image: opensuse/leap:16.0
            install: zypper --non-interactive --no-gpg-checks install python3 /packages/*.rpm
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: fragile-notepad-linux-x64
          path: dist

      - name: Install package and check CLI on the target distribution
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          INSTALL_COMMAND: ${{ matrix.install }}
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" "$DISTRO_IMAGE" \
            sh -ec "$INSTALL_COMMAND && fragile-notepad --version && fragile-notepad --help"

  publish:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs:
      - check-nightly
      - build
      - test-linux-installers
    if: ${{ needs.check-nightly.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          title="Nightly Build $(date -u +%Y-%m-%d)"
          notes="$(cat <<EOF
          Automated nightly build from ${GITHUB_SHA}.

          Artifacts:
          - Windows x64 installer and portable zip
          - Linux x64 DEB, RPM, and portable tar.gz
          - macOS Apple Silicon and Intel DMG and portable tar.gz
          EOF
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

          gh release create "${tag}" dist/* \
            --title "${title}" \
            --notes "${notes}" \
            --prerelease \
            --latest=false
