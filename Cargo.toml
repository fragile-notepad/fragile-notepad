[package]
name = "fragile-notepad"
version = "0.1.0"
authors = ["Rachel Fragile", "SoundRain"]
edition = "2024"

[features]
default = ["hybrid-rendering"]
hybrid-rendering = ["iced/wgpu-bare", "dep:iced_wgpu", "dep:wgpu"]

[dependencies]
blake3 = "1"
encoding_rs = { path = "vendor/encoding_rs" }
futures = "0.3"
iced = { path = "vendor/iced", default-features = false, features = ["tiny-skia", "tokio", "image-without-codecs", "canvas", "highlighter", "advanced", "web-colors", "linux-theme-detection", "x11", "wayland"] }
iced_wgpu = { path = "vendor/iced/wgpu", optional = true, default-features = false }
rfd = "0.16"
regex = "1"
ropey = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "io-util"] }
unicode-segmentation = "1"
unicode-ident = "1"
unicode-width = "0.2"
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "vulkan-portability"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSCell", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSThread"] }
url = "2.5"

[dev-dependencies]
iced_runtime = { path = "vendor/iced/runtime" }
tiny-skia = "0.11"
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
FileDescription = "Fragile Notepad"
LegalCopyright = "Copyright (c) 2026, Fragile Notepad authors"

[profile.release]
lto = "thin"
panic = "abort"
strip = true

[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
