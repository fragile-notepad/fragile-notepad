[package]
name = "fragile-notepad-windows-shell"
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "Optional Windows Explorer context menu component for Fragile Notepad"

[lib]
name = "fragile_notepad_shell"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Management_Deployment",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"
