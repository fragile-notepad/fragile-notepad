name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          # Temporarily disabled:
          # - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python asset and font tooling
        run: python -m pip install -r scripts/requirements-assets.txt -r scripts/requirements-font-profiles.txt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'scripts/*font_profiles*', 'scripts/font_families.py', 'scripts/requirements-font-profiles.txt') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux windowing and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            pkg-config \
            fontconfig \
            xvfb \
            xauth

      - name: Configure Linux software Vulkan adapter
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/setup-ci-vulkan.sh

      - name: Install macOS Vulkan runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install molten-vk vulkan-loader vulkan-tools
          source scripts/setup-macos-vulkan.sh
          vulkaninfo --summary

      - name: Configure Windows software Vulkan adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-ci-vulkan.ps1

      - name: Validate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Hosted Windows runners may have no usable wgpu adapter, even with SwiftShader.
          FRAGILE_ALLOW_WGPU_PARITY_SKIP: "1"
        run: .\scripts\ci.ps1

      - name: Validate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci.sh

      - name: Validate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/setup-macos-vulkan.sh
          source scripts/ci.sh
